services:
  - type: web
    name: seat-booking-api
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-booking-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true

databases:
  - name: seat-booking-db
    databaseName: bookings
    user: bookings
    plan: free
