services:
  - type: web
    name: seat-booking-api
    runtime: go
    plan: free
    region: singapore
    repo: https://github.com/MrVishwajeetDeshmukh/Booking-System.git
    branch: main
    healthCheckPath: /readyz
    buildCommand: go build -trimpath -ldflags="-s -w" -o server .
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-booking-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true
