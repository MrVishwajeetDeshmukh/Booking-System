services:
  - type: web
    name: seat-booking-api
    runtime: go
    plan: free
    region: singapore
    repo: https://github.com/MrVishwajeetDeshmukh/Booking-System.git
    branch: main
    healthCheckPath: /readyz
    buildCommand: go build -trimpath -ldflags="-s -w" -o server .
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-booking-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true

databases:
  - name: seat-booking-db
    databaseName: seat_booking_db_e8s2
    user: seat_booking_db_e8s2_user
    postgresMajorVersion: "15"
    plan: free
    region: singapore
    ipAllowList: []
    connectionPool: none
